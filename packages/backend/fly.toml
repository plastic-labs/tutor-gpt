# fly.toml - Fly.io deployment configuration for Bloom API

app = "bloom-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  # Dockerfile is in packages/backend but build context is repo root
  # Deploy with: fly deploy --dockerfile packages/backend/Dockerfile

[env]
  PORT = "3001"
  NODE_ENV = "production"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
